<!DOCTYPE html>
<html lang="id">
<head>

  <style>

    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.7rem; margin-bottom: 12px; }

<body>

    <h1>Website sedang <span>maintenance</span></h1>

</html>
